    <h1>二年级 · 音乐</h1>
    
    <article><h2>学习目标</h2>
<ul>
<li>能较准确地演唱简易歌曲，吐字清楚</li>
<li>认识简单节奏型与二拍子/三拍子感受</li>
<li>愿意参与合唱、律动与小乐器伴奏</li>
</ul>
<h2>内容方向</h2>
<ol>
<li>歌唱：四季、校园、友谊、民族童谣</li>
<li>节奏：四分、八分音符图形谱；强弱规律</li>
<li>欣赏：中外儿童歌曲与短小器乐</li>
<li>表演：歌表演、集体舞入门</li>
<li>乐器：响板、三角铁、双响筒等课堂乐器</li>
</ol>
