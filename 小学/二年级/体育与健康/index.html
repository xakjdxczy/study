    <h1>二年级 · 体育与健康</h1>
    
    <article><h2>学习目标</h2>
<ul>
<li>提高走跑跳投的协调性与耐力</li>
<li>学会简单球类与跳绳游戏</li>
<li>知道运动前热身、运动中安全</li>
</ul>
<h2>内容方向</h2>
<ol>
<li>队列队形与广播操巩固</li>
<li>短跑游戏、接力、障碍跑（低难度）</li>
<li>跳绳入门；跳跃与落地缓冲</li>
<li>小篮球/小足球游戏（传接、射门趣味化）</li>
<li>体操：滚动、平衡木/低平衡练习</li>
<li>健康：用眼卫生、饮食与睡眠</li>
</ol>
