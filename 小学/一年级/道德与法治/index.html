    <h1>一年级 · 道德与法治</h1>
    
    <article><h2>学习目标</h2>
<ul>
<li>适应小学生活，爱同学、爱老师、爱集体</li>
<li>养成基本文明礼貌与安全习惯</li>
<li>知道爱父母、爱家乡的初步情感</li>
</ul>
<h2>常见单元方向</h2>
<ol>
<li>我是小学生</li>
<li>校园生活真快乐</li>
<li>家庭与亲情</li>
<li>文明礼貌</li>
<li>安全小达人（交通、防水防火）</li>
<li>爱护环境与公物</li>
</ol>
<h2>学法建议</h2>
<ul>
<li>以故事、情境表演为主</li>
<li>结合日常行为点评，少说教</li>
</ul>
