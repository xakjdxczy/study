    <h1>一年级 · 音乐</h1>
    
    <article><h2>学习目标</h2>
<ul>
<li>能跟着唱简易儿童歌曲</li>
<li>感受快慢、强弱、高低</li>
<li>认识简单打击乐器与节奏</li>
</ul>
<h2>内容方向</h2>
<ol>
<li>歌唱：校园、动物、节日主题歌</li>
<li>节奏：拍手、踏步、敲击</li>
<li>欣赏：中外儿童音乐小品</li>
<li>表演：律动与歌表演</li>
</ol>
