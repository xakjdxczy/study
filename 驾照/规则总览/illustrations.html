<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><title>驾照示意图片段库</title><style>
/* ILLUS:styles */
.illus{margin:12px 0;padding:12px;background:#f3eee4;border-radius:12px;border:1px solid var(--line)}
.illus-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
.illus-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.illus svg,.illus-card svg{max-width:100%;height:auto;display:block;margin:0 auto}
.illus figcaption,.illus-card .cap{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.illus-title{font-size:13px;font-weight:700;color:var(--brand);margin:0 0 8px}
</style></head><body>
<p>可复用示意图片段。注入到规则总览时用 ILLUS:id 标记区。</p>

<figure class="illus" role="img" aria-label="道路标线线型对照：白虚白实黄线双黄停止线人行横道导向箭头">

  <text x="30" y="18" fill="#fff" font-size="11">白虚</text>

  <line x1="20" y1="80" x2="100" y2="80" stroke="#fff" stroke-width="6"/>
  <!-- crosswalk -->
  <text x="150" y="70" fill="#fff" font-size="11">人行横道</text>
  <g transform="translate(140,78)">
    <rect x="0" y="0" width="8" height="40" fill="#fff"/><rect x="14" y="0" width="8" height="40" fill="#fff"/>
    <rect x="28" y="0" width="8" height="40" fill="#fff"/><rect x="42" y="0" width="8" height="40" fill="#fff"/>
    <rect x="56" y="0" width="8" height="40" fill="#fff"/><rect x="70" y="0" width="8" height="40" fill="#fff"/>
  </g>
  <!-- arrows -->
  <text x="280" y="70" fill="#fff" font-size="11">导向箭头</text>
  <g fill="#fff" transform="translate(270,85)">
    <path d="M20 40 L20 10 L10 20 M20 10 L30 20" stroke="#fff" stroke-width="3" fill="none"/>

    <text x="106" y="30" font-size="18">↱</text>
  </g>
</svg>

</figure>
