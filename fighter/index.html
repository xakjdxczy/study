<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>雷霆战机</title>
    <meta name="description" content="天上敌机往下压，捡到发光道具子弹就升级。创建房间就能和朋友联机空战。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game" width="720" height="1100" aria-label="雷霆战机"></canvas>
      <div id="ui" class="ui">
        <section id="lobby" class="card">
          <h1>雷霆战机</h1>
          <p class="lead">天上敌机一波波往下压。战机会自己开火，左手滑着躲和捡，右手按住可连射，炸弹清屏。捡到 P 子弹就升级。</p>
          <label>你的名字<input id="nick" maxlength="8" placeholder="雷霆" autocomplete="nickname" /></label>
          <div class="row">
            <button type="button" id="btnQuick" class="primary">快速匹配</button>
            <button type="button" id="btnCreate">创建房间</button>
            <button type="button" id="btnLobbyFs">全屏</button>
          </div>
          <div class="row">
            <input id="code" maxlength="4" placeholder="房间号" autocapitalize="characters" />
            <button type="button" id="btnJoin">加入</button>
          </div>
          <p id="status" class="status">正在连线上网关…</p>
        </section>
        <section id="room" class="card hidden">
          <h2>编队 <strong id="roomCode">----</strong></h2>
          <p class="lead">把房间号发给朋友。开打后左手移动、右手射击/炸弹，吃到道具就变强。</p>
          <ul id="plist" class="plist"></ul>
          <div class="row">
            <button type="button" id="btnStart" class="primary">起飞</button>
            <button type="button" id="btnLeave">离开</button>
          </div>
        </section>
        <section id="over" class="card hidden">
          <h2 id="overTitle">空战结束</h2>
          <ol id="ranks" class="ranks"></ol>
          <div class="row">
            <button type="button" id="btnAgain" class="primary">再来一局</button>
            <button type="button" id="btnLobby">回大厅</button>
          </div>
        </section>
      </div>
      <div id="pads" class="pads hidden">
        <div class="hand-left" id="moveZone">
          <div class="stick" id="stick">
            <div class="stick-ring"></div>
            <div class="stick-knob" id="stickKnob"></div>
            <div class="stick-hint">左手移动</div>
          </div>
        </div>
        <div class="hand-right">
          <button type="button" class="act-btn act-bomb" id="btnBomb">弹</button>
          <button type="button" class="act-btn act-fire" id="btnFire">射</button>
        </div>
      </div>
      <div class="hud-links">
        <a class="chip" href="../">回主目录</a>
        <button type="button" class="chip" id="fullBtn" aria-pressed="false">全屏</button>
      </div>
    </div>
    <script src="shared.js"></script>
    <script src="game.js"></script>
  </body>
</html>
