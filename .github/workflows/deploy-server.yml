name: Deploy to cloud server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish /study/ over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing GitHub Actions secret SSH_PRIVATE_KEY" >&2
            exit 1
          fi
          export SSH_HOST="${SSH_HOST:-117.72.108.246}"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          bash scripts/deploy-server.sh
          echo "课本 https://${SSH_HOST}/study/" >> "$GITHUB_STEP_SUMMARY"
          echo "滑雪大冒险 https://${SSH_HOST}/study/ski/" >> "$GITHUB_STEP_SUMMARY"
